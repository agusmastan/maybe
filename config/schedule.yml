import_market_data:
  cron: "0 8 * * *" # Once daily at 8:00 AM (optimized for single-user, saves API tokens)
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data (security prices, exchange rates) for Investment holdings"
  args:
    mode: "full"
    clear_cache: false

clean_syncs:
  cron: "0 */6 * * *" # every 6 hours (single-user doesn't need hourly cleanup)
  class: "SyncCleanerJob"
  queue: "scheduled"
  description: "Cleans up stale syncs"

run_security_health_checks:
  cron: "0 2 * * 1" # 2:00 AM EST Monday only (weekly is enough for single-user)
  class: "SecurityHealthCheckJob"
  queue: "scheduled"
  description: "Runs security health checks to detect issues with security data"